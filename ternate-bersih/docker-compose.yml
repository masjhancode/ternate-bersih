services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ternate_bersih_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ternate_bersih
    ports:
      - "5433:5432"
    volumes:
      - ternate_bersih_db_data:/var/lib/postgresql/data

volumes:
  ternate_bersih_db_data:
